# Production stack (task 0014): nginx serves the built SPA and reverse-proxies the API, in front of the
# FastAPI app (mock mode + migrations on boot), the synthetic MySQL query DB, and the Postgres app store.
# Single origin via nginx → no CORS. Only nginx is published; the app port stays on the internal network.
#
# This file lives under docker/; run it from the repo root so the root .env is picked up:
#   create a .env with the required secrets (template + generator in DEPLOY.md)
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Build context is the repo root (..) for both images so the frontend build can reach docker/nginx.conf.
# See DEPLOY.md for the full runbook (the .env template, TLS, the demo↔live switch, backups).
#
# Pin the project name so container/volume names stay `text-to-sql-rag_*` regardless of the compose
# file's folder — the same default it had when this file lived in the repo root.
name: text-to-sql-rag
services:
  web:
    # Pull the pre-built image from GHCR (published by .github/workflows/release.yml). `build:` is kept as
    # a from-source fallback: `docker compose … pull` uses the registry image; `… up --build` builds locally.
    image: ghcr.io/rad710/text-to-sql-rag/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"    # published port (default 80); put TLS (Caddy/Cloudflare) in front
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ghcr.io/rad710/text-to-sql-rag/app:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # No published port — reachable only as `app:8000` on the compose network, via nginx.
    expose:
      - "8000"
    environment:
      DEPLOY_MODE: ${DEPLOY_MODE:-demo}   # demo = mock LLM, generous limits (see decision 0010)
      LLM_MODE: ${LLM_MODE:-mock}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ bytes) for a real deploy}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-llm_readonly}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: dyrtransportes
      APP_DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD:-app}@postgres:5432/dyr_app
    depends_on:
      mysql:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: dyrtransportes   # empty schema on first boot; Flyway fills it (see flyway service)
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # One-shot mock-DB migrator (decision 0011): applies mock-db/migration/V*.sql once MySQL is healthy,
  # then exits. Idempotent via Flyway's schema-history table, so it's a no-op on subsequent boots (the
  # mysqldata volume persists the schema). `restart: "no"` — it must run to completion, not be restarted.
  flyway:
    image: flyway/flyway:11
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/dyrtransportes?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_PLACEHOLDERS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command: migrate
    volumes:
      - ../mock-db/migration:/flyway/sql:ro
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app}
      POSTGRES_DB: dyr_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dyr_app"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
