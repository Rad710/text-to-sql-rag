# nginx: serve the built SPA and reverse-proxy the API to the app container (same origin → no CORS).
# `app` is the FastAPI service name on the compose network.

upstream api {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (decision 0013). Strict, same-origin CSP — the SPA loads nothing off-origin, so
    # this sharply limits the blast radius of any XSS (the bearer-token hardening depends on it).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Static assets are content-hashed by Vite → safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API surface — proxy to FastAPI. `/chat` is a Server-Sent-Events stream, so buffering MUST be
    # off and HTTP/1.1 kept open, or the browser would only see events after the response closed.
    location ~ ^/(chat|auth|conversations|feedback|health) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;      # stream SSE frames straight through
        proxy_read_timeout 300s;  # long-running agent turns
    }

    # SPA client-side routing: everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
