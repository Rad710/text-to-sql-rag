# Build the app + web images and push them to the GitHub Container Registry (ghcr.io).
# The production stack (docker/docker-compose.prod.yml) pulls these images instead of building on the VM.
#
# Triggers: push a version tag (`git tag v1.0.0 && git push --tags`) or run it by hand from the Actions
# tab (workflow_dispatch). Auth uses the automatic GITHUB_TOKEN — no secrets to configure. The pushed
# packages start private; make them public (or `docker login ghcr.io` on the VM) to pull them — see DEPLOY.md.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/rad710/text-to-sql-rag   # owner must be lowercase for GHCR

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: docker/Dockerfile
          - name: web
            dockerfile: docker/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          # v1.2.3 → tags 1.2.3 + v1.2.3; short SHA on every run; `latest` on tag/dispatch.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      # Build context is the repo root so the frontend image can reach docker/nginx.conf (see task 0031).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
