name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app evaluation

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=app --cov=evaluation --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check (Biome)
        run: pnpm lint

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Test (vitest — jsdom mount + SSE stream render)
        run: pnpm test

  integration:
    runs-on: ubuntu-latest
    # Throwaway credentials for the ephemeral CI service container only — never used elsewhere.
    env:
      MYSQL_ROOT_PASSWORD: ci-root-pw
      MYSQL_DATABASE: dyrtransportes
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: llm_readonly
      DB_PASSWORD: ci-readonly-pw
      DB_NAME: dyrtransportes
      APP_DATABASE_URL: postgresql+asyncpg://app:ci-app-pw@127.0.0.1:5432/dyr_app
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: dyrtransportes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-app-pw
          POSTGRES_DB: dyr_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d dyr_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Apply schema + seed + read-only grant (same scripts as docker compose)
        env:
          MYSQL_HOST: 127.0.0.1
        run: |
          mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" < db/init/01_schema.sql
          mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" < db/init/02_seed.sql
          bash db/init/03_grant_readonly.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Migrate the app datastore (Alembic → Postgres)
        run: uv run alembic upgrade head

      - name: Integration tests (live MySQL read-only guarantee + Postgres round-trip)
        run: uv run pytest -m integration
