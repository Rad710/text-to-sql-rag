name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # The Python project lives in backend/; all run steps below execute there (task 0035).
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app evaluation

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=app --cov=evaluation --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check (Biome)
        run: pnpm lint

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Test (vitest — jsdom mount + SSE stream render)
        run: pnpm test

  integration:
    runs-on: ubuntu-latest
    # Throwaway credentials for the ephemeral CI service container only — never used elsewhere.
    env:
      QUERY_DB_ROOT_PASSWORD: ci-root-pw
      QUERY_DB_HOST: 127.0.0.1
      QUERY_DB_PORT: "3306"
      QUERY_DB_USER: llm_readonly
      QUERY_DB_PASSWORD: ci-readonly-pw
      QUERY_DB_NAME: dyrtransportes
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: "5432"
      APP_DB_USER: app
      APP_DB_PASSWORD: ci-app-pw
      APP_DB_NAME: dyr_app
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: dyrtransportes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-app-pw
          POSTGRES_DB: dyr_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d dyr_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Apply mock-db migrations (Flyway — same migrations as docker compose)
        run: |
          docker run --rm --network host \
            -v "$PWD/mock-db/migration:/flyway/sql:ro" \
            flyway/flyway:11 \
            -url="jdbc:mysql://127.0.0.1:3306/dyrtransportes?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password="$QUERY_DB_ROOT_PASSWORD" \
            -placeholders.db_password="$QUERY_DB_PASSWORD" \
            -connectRetries=60 -locations=filesystem:/flyway/sql migrate

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Migrate the app datastore (Alembic → Postgres)
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Integration tests (live MySQL read-only guarantee + Postgres round-trip)
        working-directory: backend
        run: uv run pytest -m integration

  e2e:
    runs-on: ubuntu-latest
    # Full-stack Playwright journey (task 0023): real browser → Vite (proxy) → FastAPI (mock) → both DBs.
    # Throwaway credentials for the ephemeral CI service containers only.
    env:
      QUERY_DB_ROOT_PASSWORD: ci-root-pw
      QUERY_DB_HOST: 127.0.0.1
      QUERY_DB_PORT: "3306"
      QUERY_DB_USER: llm_readonly
      QUERY_DB_PASSWORD: ci-readonly-pw
      QUERY_DB_NAME: dyrtransportes
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: "5432"
      APP_DB_USER: app
      APP_DB_PASSWORD: ci-app-pw
      APP_DB_NAME: dyr_app
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: dyrtransportes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-app-pw
          POSTGRES_DB: dyr_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d dyr_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Apply mock-db migrations (Flyway)
        run: |
          docker run --rm --network host \
            -v "$PWD/mock-db/migration:/flyway/sql:ro" \
            flyway/flyway:11 \
            -url="jdbc:mysql://127.0.0.1:3306/dyrtransportes?allowPublicKeyRetrieval=true&useSSL=false" \
            -user=root -password="$QUERY_DB_ROOT_PASSWORD" \
            -placeholders.db_password="$QUERY_DB_PASSWORD" \
            -connectRetries=60 -locations=filesystem:/flyway/sql migrate

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Migrate the app datastore (Alembic → Postgres)
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API (mock mode)
        working-directory: backend
        run: |
          nohup uv run uvicorn app.api:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || { echo "API failed to start"; cat /tmp/api.log; exit 1; }

      - name: Run Playwright e2e
        working-directory: frontend
        run: pnpm e2e
