[project]
name = "text-to-sql-rag"
version = "0.1.0"
description = "Agentic text-to-SQL RAG assistant over a synthetic freight/logistics schema"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pymysql>=1.1",
]

# Heavy/opt-in deps land in the task that first needs them:
#   0004 → sqlglot   0005 → chromadb   0007 → openai
#   (embeddings extra → sentence-transformers)
[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Integration tests (live MySQL) are opt-in: the default run stays fast and DB-free.
# Run them with:  uv run pytest -m integration
addopts = '-q -m "not integration"'
markers = [
    "integration: requires a live MySQL (the synthetic demo DB)",
]
