[project]
name = "text-to-sql-rag"
version = "0.1.0"
description = "Agentic text-to-SQL RAG assistant over a synthetic freight/logistics schema"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "pymysql>=1.1",
    "sqlglot>=25.0",
    "chromadb>=0.5",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # App datastore (decision 0008): separate Postgres for users/conversations/feedback.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Auth (decision 0009): JWT bearer tokens + bcrypt password hashing.
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",  # pydantic EmailStr — validates the register/login email format
]

# Opt-in extra for a real transformer embedder (deferred; offline embedder is the default):
#   embeddings extra → sentence-transformers
[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.0"]
# Standalone read-only SQL MCP server (task 0011). Opt-in: the core API doesn't need it.
mcp = ["mcp>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1",  # coverage reporting in CI (task 0013)
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",  # FastAPI TestClient
    "pre-commit>=4.0",  # local ruff/ruff-format/mypy hooks (task 0013)
    "mcp>=2.0",  # installed for tests/CI of the MCP server (task 0011); runtime extra is [mcp]
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the idiomatic exception to "no calls in defaults".
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pymysql.*", "chromadb.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app", "evaluation"]

[tool.coverage.report]
show_missing = true
# A floor with headroom under today's ~86% unit coverage — catches a real regression without being a
# brittle line-by-line ratchet. DB-heavy modules are covered by the integration job, not this run.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Integration tests (live MySQL) are opt-in: the default run stays fast and DB-free.
# Run them with:  uv run pytest -m integration
addopts = '-q -m "not integration"'
markers = [
    "integration: requires a live MySQL (the synthetic demo DB)",
]
